name: Build OpenWrt x86_64 (OAF)

# 触发方式：
#   1. 手动触发：进入仓库 Actions 页面，选择本工作流点 “Run workflow”
#   2. 或推送到 main 分支自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库（含 scripts/config 目录）
        uses: actions/checkout@v4

      - name: 安装 OpenWrt 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: 构建 OpenWrt 定制固件（含 OAF + 分区扩容工具）
        run: |
          chmod +x scripts/setup-build.sh
          ./scripts/setup-build.sh

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-oaf-x86_64
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
